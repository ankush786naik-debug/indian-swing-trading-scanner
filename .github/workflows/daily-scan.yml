      - name: Diagnose EODHD India coverage
        env:
          EODHD_API_TOKEN: ${{ secrets.EODHD_API_TOKEN }}
        run: |
          python - <<'PY'
          import os
          import requests

          token = os.environ["EODHD_API_TOKEN"]
          base = "https://eodhd.com/api"

          r = requests.get(
              f"{base}/exchanges-list/",
              params={"api_token": token, "fmt": "json"},
              timeout=30
          )
          print("Exchange list status:", r.status_code)

          if r.ok:
              for x in r.json():
                  if "india" in x.get("Country", "").lower():
                      print("INDIA EXCHANGE:", x)

          for endpoint in ["exchange-symbol-list/NSE", "eod/ABB.NSE"]:
              r = requests.get(
                  f"{base}/{endpoint}",
                  params={"api_token": token, "fmt": "json"},
                  timeout=30
              )
              print(endpoint, "STATUS:", r.status_code)
              print(r.text[:500])
          PY
