name: Daily Indian Stock Scanner

on:
  # TejHQ publishes daily NSE bhavcopy in the evening; run after its retry window.
  schedule:
    - cron: '15 16 * * 1-5'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate Python files
        run: python -m compileall -q .

      - name: Run stock scanner
        env:
          TEJ_API_KEY: ${{ secrets.TEJ_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CAPITAL: '100000'
          MIN_STOCK_PRICE: '200'
          MAX_STOCKS: '500'
          RISK_PER_TRADE: '0.01'
        run: python scanner.py

      - name: Upload scanner outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nse-scanner-results
          path: data/
          if-no-files-found: warn
          retention-days: 7
