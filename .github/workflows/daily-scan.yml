name: Daily NSE Swing Research

on:
  schedule:
    # 4:15 PM IST weekdays, after the regular NSE cash session
    - cron: '45 10 * * 1-5'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Validate Python
        run: python -m compileall -q .
      - name: Run all-NSE swing research
        env:
          UPSTOX_ANALYTICS_TOKEN: ${{ secrets.UPSTOX_ANALYTICS_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MAX_FUNDAMENTAL_CANDIDATES: '25'
          MIN_DAILY_TURNOVER_CRORE: '3'
          MIN_FINAL_SCORE: '62'
        run: python scanner.py
      - name: Upload daily Top-5 CSV and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-all-qualified-swing-research
          path: |
            data/all_swing_stocks.csv
            data/all_swing_stocks_*.csv
            data/scan_diagnostics.json
          if-no-files-found: warn
          retention-days: 30
